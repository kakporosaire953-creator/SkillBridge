<!DOCTYPE html>
<html lang="fr" class="h-full bg-[#F7F8F3] text-[#1A2233] antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillBridge — The bridge between skills and opportunities.</title>
    <meta name="description" content="SkillBridge connects skills, talent, experience and opportunities to build a stronger ecosystem around African talent." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="h-full bg-[#F7F8F3] text-[#1A2233] selection:bg-[#68A91B] selection:text-white overflow-x-hidden font-sans">
    <div id="logs" style="color:red; background:white; position:fixed; z-index:9999; top:0; left:0;"></div>
    <script>window.onerror = function(m,s,l,c,e) { document.getElementById("logs").innerText += m + "\n"; }; window.addEventListener("unhandledrejection", function(e) { document.getElementById("logs").innerText += (e.reason?e.reason.message:"promise error") + "\n"; });</script>
    <div id="root" class="min-h-full flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
